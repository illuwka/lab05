$kind: http-request
url: "{{baseUrl}}/api/products/{{productId}}"
method: GET
headers:
  Accept: application/json
scripts:
  - type: afterResponse
    code: pm.test('200 OK',()=>pm.response.to.have.status(200)); pm.test('ID збігається',()=>pm.expect(String(pm.response.json().id)).to.eql(pm.collectionVariables.get('productId')));
    language: text/javascript
order: 6000
